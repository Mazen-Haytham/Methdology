name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "ASPNETCORE_ENVIRONMENT=${{ secrets.ASPNETCORE_ENVIRONMENT }}" >> .env
          echo "ASPNETCORE_URLS=${{ secrets.ASPNETCORE_URLS }}" >> .env
          echo "ConnectionStrings__DefaultConnection=${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}" >> .env
          echo "JWT__Key=${{ secrets.JWT__KEY }}" >> .env
          echo "JWT__Issuer=${{ secrets.JWT__ISSUER }}" >> .env
          echo "JWT__Audience=${{ secrets.JWT__AUDIENCE }}" >> .env
          echo "AdminSettings__Email=${{ secrets.ADMINSETTINGS__EMAIL }}" >> .env
          echo "AdminSettings__Password=${{ secrets.ADMINSETTINGS__PASSWORD }}" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Extract dist folder from Frontend container
        run: |
          docker cp petadopt_frontend:/usr/share/nginx/html ./Frontend/dist

      - name: Verify containers are running
        run: |
          docker compose ps
          docker compose logs --tail=20

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./Frontend/dist"
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
